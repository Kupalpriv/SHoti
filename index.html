<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoti</title>
    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="title">🎥 Shoti TV</h1>
        
        <div class="video-card">
            <video id="videoPlayer" class="video-element" controls></video>
            <div class="user-info">
                <h2 id="username" class="username">@username</h2>
                <p id="nickname" class="nickname">Nickname</p>
                <p id="bio" class="bio">User bio will appear here</p>
            </div>
        </div>

        <button id="newVideoBtn" class="mdc-button mdc-button--raised">
            <span class="mdc-button__label">🎲 Generate</span>
        </button>
    </div>
</body>
</html>
